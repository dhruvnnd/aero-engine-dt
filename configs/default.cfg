# Engine spec for the aero-engine-dt digital twin.
# Flat 'key = value' text; '#' starts a whole-line comment;
# blank lines are ignored. Any field left out keeps
# engine_config_default()'s value, so a spec file only needs to
# override what's different for this engine.

# Number of active cylinders (1..6 / ENGINE_MAX_CYLINDERS).
num_cylinders = 4

# 1-based cylinder firing order, comma-separated, one entry per
# active cylinder above. Consecutive entries fire
# 720/num_cylinders crank degrees apart.
firing_order = 1,3,4,2

# Effective rotating inertia of crank + flywheel + prop, kg*m^2.
# Typical range for a small 4-cyl aero piston engine: 0.3 - 1.0.
inertia_kg_m2 = 0.6

# Manifold filling time constant, s -- how fast MAP chases its
# throttle target. Typical range: 0.1 - 0.4. (Replaced by a real
# mass-balance ODE in a later phase; still the live MAP dynamics
# for now.)
map_tau_s = 0.25

# Simple viscous friction coefficient, N*m per rad/s of crank
# speed. Typical range: 0.05 - 0.2.
friction_coeff_nm_per_rad_s = 0.12

# --- Reserved for future phases (not yet loadable) ---
# Geometry (bore, stroke, conrod, compression ratio, IVC/EVO)
# lands with Phase 1; propeller, volumetric-efficiency curve,
# plenum volume, ignition map, alternator efficiency,
# thermal-network constants, and vibration spring/damper
# constants land with later phases. This file will grow keys for
# each as they're implemented -- unknown keys are ignored with a
# warning, so old spec files keep working.
