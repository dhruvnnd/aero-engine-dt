# Engine spec for the aero-engine-dt digital twin.
# Flat 'key = value' text; '#' starts a whole-line comment;
# blank lines are ignored. Any field left out keeps
# engine_config_default()'s value, so a spec file only needs to
# override what's different for this engine.

# Number of active cylinders (1..6 / ENGINE_MAX_CYLINDERS).
num_cylinders = 4

# 1-based cylinder firing order, comma-separated, one entry per
# active cylinder above. Consecutive entries fire
# 720/num_cylinders crank degrees apart.
firing_order = 1,3,4,2

# Effective rotating inertia of crank + flywheel + prop, kg*m^2.
# Typical range for a small 4-cyl aero piston engine: 0.3 - 1.0.
inertia_kg_m2 = 0.6

# Every other field (geometry, propeller, ECU/idle governor,
# volumetric efficiency, combustion tuning, ...) is left out here
# on purpose, to keep engine_config_default()'s already-validated
# values -- see the Spec Editor or `twin_config --new` for the
# full list of overridable keys with their current defaults and
# typical ranges. Don't add a key here (e.g. an old
# friction_coeff_nm_per_rad_s value) just because a past version
# of this file had one: that silently reintroduces whatever the
# default has since been retuned away from.
